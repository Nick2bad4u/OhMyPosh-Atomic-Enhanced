name: Update ChangeLogs

on:
    workflow_dispatch:

concurrency:
    group: update-changelogs-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    update_changelogs:
        runs-on: windows-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout repository (Full history)
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "20"

            - name: Generate CHANGELOG.md files (With verbose logging)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  Write-Information "Generating changelogs with git-cliff..." -InformationAction Continue
                  npx --yes --package git-cliff@2.13.1 git-cliff --config cliff.toml --verbose --output CHANGELOG.md
                  if ($LASTEXITCODE -ne 0) {
                    throw "git-cliff exited with code $LASTEXITCODE."
                  }
                  Get-ChildItem -Name

            - name: Create Pull Request for changelogs
              id: create-pull-request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  commit-message: "chore: update changelogs [skip ci]"
                  title: "chore: update changelogs"
                  body: "Automated changelog update via GitHub Actions.\n\nThis PR was created automatically and will not be merged automatically."
                  branch: "chore/update-changelogs"
                  add-paths: "**/CHANGELOG.md"
                  delete-branch: false
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Add Job Summary
              if: always()
              shell: pwsh
              run: |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY "## 📝 Changelog Update Workflow Summary"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY "- Changelog generation and pull-request handling completed when preceding steps succeeded."
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY "- Pull request: ${{ steps.create-pull-request.outputs.pull-request-url || 'No changelog changes required' }}"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY "- Workflow completed with status: ${{ job.status }}."
