name: PSSecretScanner

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pssecret-${{ github.ref }}
    cancel-in-progress: false

jobs:
    pssecret-scanner:
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            # PowerShell is available by default on ubuntu-latest, so no setup step is required
            - name: Install PSSecretScanner
              shell: pwsh
              run: |
                  Install-Module -Name PSSecretScanner -RequiredVersion 2.0.3 -Repository PSGallery -Force -Scope CurrentUser -ErrorAction Stop
            - name: Run PSSecretScanner
              shell: pwsh
              run: |
                  Import-Module PSSecretScanner -RequiredVersion 2.0.3 -Force -ErrorAction Stop
                  $scan = Find-Secret -Path . -Excludelist .ignoresecrets
                  $findings = @($scan.Results)

                  if ($findings.Count -gt 0) {
                    $repositoryRoot = (Get-Location).Path
                    $findings |
                      Group-Object {
                        $relativePath = [IO.Path]::GetRelativePath($repositoryRoot, $_.Path)
                        "${relativePath}:$($_.LineNumber) [$($_.PatternName)]"
                      } |
                      Sort-Object Name |
                      ForEach-Object {
                        Write-Warning "$($_.Name) ($($_.Count) finding(s))"
                      }

                    throw "PSSecretScanner found $($findings.Count) potential secret(s). Values are intentionally omitted from workflow logs."
                  }

                  Write-Information "PSSecretScanner inspected $(@($scan.ScanFiles).Count) files and found no secrets." -InformationAction Continue
