name: Automatic Rebase
on:
    issue_comment:
        types: [created]
permissions:
    contents: read

jobs:
    rebase:
        permissions:
            contents: write # for cirrus-actions/rebase to push code to rebase
            pull-requests: read # for cirrus-actions/rebase to get info about PR
        name: Rebase
        runs-on: ubuntu-latest
        if: >-
            github.event.issue.pull_request != null &&
            (
              github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'MEMBER' ||
              github.event.comment.author_association == 'COLLABORATOR'
            ) &&
            (
              startsWith(github.event.comment.body, '/rebase') ||
              startsWith(github.event.comment.body, '/autosquash')
            )
        concurrency:
            group: rebase-${{ github.event.issue.number }}
            cancel-in-progress: false
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit

            - name: Checkout the latest code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0 # otherwise, you will fail to push refs to dest repo
            - name: Automatic Rebase
              uses: cirrus-actions/rebase@b87d48154a87a85666003575337e27b8cd65f691 # 1.8
              with:
                  autosquash: ${{ startsWith(github.event.comment.body, '/autosquash') || startsWith(github.event.comment.body, '/rebase-autosquash') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
